    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#17617b"/><stop offset="1" stop-color="#07151f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="930" cy="160" r="78" fill="#6fd0ff" opacity=".12"/>
