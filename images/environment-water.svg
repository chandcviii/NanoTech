  <g fill="#a8e8ff"><circle cx="270" cy="470" r="9"/><circle cx="360" cy="535" r="7"/><circle cx="180" cy="610" r="8"/><circle cx="520" cy="450" r="6"/></g>
  <rect x="600" y="325" width="155" height="225" rx="16" fill="#0a1821" stroke="#8aa0b2" stroke-width="7"/>
  <path d="M620 365h115M620 395h115M620 425h115M620 455h115M620 485h115" stroke="#2b6f93" stroke-width="8"/>
