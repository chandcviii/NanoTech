<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Nanomaterials and water ecosystems</title>
  <desc id="desc">A stream and aquatic plants surround a filter that catches glowing particles before they reach wildlife.</desc>
