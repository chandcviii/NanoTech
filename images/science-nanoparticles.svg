<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Nanoparticles under a microscope</title>
  <desc id="desc">Glowing particles of different sizes cluster across a deep blue field.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#102b3a"/><stop offset="1" stop-color="#050a10"/></radialGradient>
    <radialGradient id="p"><stop stop-color="#d8f5ff"/><stop offset=".28" stop-color="#6fd0ff"/><stop offset=".7" stop-color="#27769b"/><stop offset="1" stop-color="#102532"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="none" stroke="#29495a" opacity=".38">
    <path d="M0 180 220 80l180 130 210-110 210 135 180-115 200 95M0 600l180-115 180 135 220-110 190 120 220-100 210 100"/>
    <path d="M155 0 270 800M515 0 460 800M970 0 850 800"/>
  </g>
  <g fill="#6fd0ff" opacity=".24" filter="url(#glow)">
    <circle cx="310" cy="300" r="90"/><circle cx="710" cy="420" r="125"/><circle cx="930" cy="220" r="76"/>
  </g>
  <g fill="url(#p)" stroke="#a8e8ff" stroke-opacity=".52">
    <circle cx="310" cy="300" r="57"/><circle cx="710" cy="420" r="78"/><circle cx="930" cy="220" r="47"/>
    <circle cx="500" cy="205" r="24"/><circle cx="180" cy="510" r="31"/><circle cx="1010" cy="555" r="33"/>
    <circle cx="520" cy="590" r="20"/><circle cx="830" cy="625" r="25"/><circle cx="110" cy="160" r="16"/>
  </g>
  <g fill="#d9f6ff" opacity=".8">
    <circle cx="290" cy="280" r="8"/><circle cx="680" cy="390" r="12"/><circle cx="913" cy="204" r="7"/>
    <circle cx="493" cy="199" r="4"/><circle cx="170" cy="501" r="5"/>
  </g>
  <rect x="42" y="42" width="290" height="62" rx="8" fill="#08131ccc" stroke="#2b6f93"/>
  <text x="66" y="82" fill="#dbe6ee" font-family="Segoe UI,sans-serif" font-size="26" letter-spacing="3">NANO / 01</text>
  <path d="M848 690h240" stroke="#6fd0ff" stroke-width="5"/><path d="M848 678v24m240-24v24" stroke="#6fd0ff" stroke-width="4"/>
  <text x="968" y="735" text-anchor="middle" fill="#8aa0b2" font-family="Segoe UI,sans-serif" font-size="22">particle field</text>
</svg>
